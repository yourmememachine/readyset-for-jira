# ReadySet for Jira — Forge manifest (phase 1)
#
# Phase 1 modules: issue readiness panel, project dashboard, issue-event
# rescoring, nightly scheduled rescan. Phase 2 adds the Forge LLM improver,
# Rovo agent + actions (see ../DESIGN.md §5.3).
#
# NOTE: `app.id` is a placeholder. `forge register` (phase 2) assigns the
# real app id before the first deploy. The manifest intentionally contains
# no `license:` key — link sharing is disabled on licensed apps, and the
# installation link is this entry's distribution path (DESIGN.md §1).
modules:
  jira:issueContext:
    - key: readyset-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      title: ReadySet
      # Required on jira:issueContext: without a label the panel does not
      # render at all (cross-review B2 — found in the official Forge
      # tutorial's manifest, missed by the phase-1 template).
      label: ReadySet
  jira:projectPage:
    - key: readyset-project-page
      resource: project-page
      resolver:
        function: resolver
      title: ReadySet — Project Readiness
  trigger:
    - key: readyset-issue-events
      function: event-handler
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        # Deleted issues must leave the dashboard promptly (B9).
        - avi:jira:deleted:issue
  scheduledTrigger:
    - key: readyset-nightly-rescan
      function: scheduled-handler
      interval: day
  function:
    - key: resolver
      handler: index.handler
    - key: event-handler
      handler: index.eventHandler
    - key: scheduled-handler
      handler: index.scheduledHandler
resources:
  - key: issue-panel
    path: src/frontend/issue-context.tsx
  - key: project-page
    path: src/frontend/project-page.tsx
app:
  id: ari:cloud:ecosystem::app/00000000-0000-4000-8000-000000000000
  runtime:
    name: nodejs22.x
  # storage:app covers Forge KVS; read:jira-work covers the Jira REST
  # reads. The app performs no Jira writes in phase 1 — the write scope
  # was dropped in cross-review B17 and returns with the phase-2 Apply
  # flow that actually uses it.
  permissions:
    scopes:
      - read:jira-work
      - storage:app
